# Short smoke run: mini training set, Llama3 170M, v2 tokenizer, first few raw/processed samples in logs.
# Data: bundled mini set (no Weka). Model: Llama3 170M. No checkpoint / aim / validation.

[job]
dump_folder = "/mnt/weka/gsimonyan/checkpoints/smoke_runs"
description = "smoke: first-batch preview logging (multi-GPU)"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_color_printing = true
enable_aim = false
save_aim_folder = "aim_smoke"

[model]
name = "llama3"
flavor = "170M"
norm_type = "rmsnorm"
tokenizer_path = "/home/gsimonyan/YNNtitan/torchtitan/tokenizers/Llama-3.2-chem-1B-v2/"

[optimizer]
name = "AdamW"
lr = 6e-4

[training]
batch_size = 2
gradient_accumulation_steps = 1
seq_len = 2048
max_norm = 1.0
warmup_steps = 2
# Need enough steps that int(steps * decay_steps_perc) >= 1 for the LR scheduler (e.g. steps=5 and 10% decay gives 0).
steps = 12
decay_steps_perc = 0.1
num_decays = 1
data_parallel_degree = -1
tensor_parallel_degree = 1
compile = false
dataset = "chemlactica_train_mini"
data_processing_style = "pubchem_data_processing"
representation_type = "SMILES"

[validation]
enable_valid = false

[dataloader]
num_workers = 0
# Log the first N training records (raw JSON text + processed string) from the dataloader; 0 disables.
print_first_samples = 5

[experimental]
pipeline_parallel_degree = 1
enable_async_tensor_parallel = false

[checkpoint]
enable_checkpoint = false
save_folder = "smoke_unused"
interval_type = "steps"
interval = 999999
model_weights_only = true
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "none"
selective_ac_option = "2"

[float8]
enable_float8_linear = false
