# Llama 3.2 380M "ranged" — chemllama-style training + HF export.
# Training uses simple RoPE (rope_theta=500000 on 380M flavor, pre-c4a648f).
# HF export inherits llama3 rope_parameters from the Llama-3.2-1B config template.
#
# Submit:
#   source .env_vars_dev
#   TRAIN_CONFIG=./train_configs/llama3_380m_ranged.toml N_GPUS=6 \
#     sbatch --time=24:00:00 --gpus-per-node=6 --cpus-per-task=138 \
#     --output="${SLURM_LOG_DIR}/job_%j/%j.out" --error="${SLURM_LOG_DIR}/job_%j/%j.err" \
#     train_single_node.slurm

[job]
dump_folder = "${oc.env:DUMP_DIR}"
description = "Llama 3.2 380M ranged (chemllama-style export)"
use_for_integration_test = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
enable_color_printing = true
enable_aim = true
save_aim_folder = "ranged_models"

[model]
name = "llama3"
flavor = "380M"
norm_type = "rmsnorm"
tokenizer_path = "${oc.env:TOKENIZER_PATH,torchtitan/tokenizers/Llama-3.2-chem-1B-v2/}"

[optimizer]
name = "AdamW"
lr = 6e-4

[training]
batch_size = 14
gradient_accumulation_steps = 9
seq_len = 2048
max_norm = 1.0
warmup_steps = 500
steps = 20000
decay_steps_perc = 0.1
num_decays = 1
data_parallel_degree = -1
tensor_parallel_degree = 1
compile = true
dataset = "chemlactica_train"
data_processing_style = "pubchem_data_processing"
representation_type = "SMILES"
seed = 42
deterministic = true
deterministic_math_sdp = false

[validation]
valid_freq = 2000
enable_valid = true
dataset = "chemlactica_valid"

[dataloader]
num_workers = 2
print_first_samples = 5

[experimental]
pipeline_parallel_degree = 1
enable_async_tensor_parallel = false

[checkpoint]
enable_checkpoint = true
save_folder = "chemllama-380M-ranged"
interval_type = "steps"
interval = 2000
model_weights_only = false
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = 'none'
selective_ac_option = '2'

[float8]
enable_float8_linear = false
