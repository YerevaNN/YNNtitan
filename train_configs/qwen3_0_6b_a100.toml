# torchtitan Config.toml - Qwen3 0.6B for A100

[job]
dump_folder = "/nfs/h100/raid/chem/checkpoints"
description = "Qwen3 0.6B training on A100"
use_for_integration_test = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
enable_color_printing = true
enable_aim = true
save_aim_folder = "aim_conformers_qwen3"

[model]
name = "qwen3"
flavor = "0.6B"
norm_type = "rmsnorm"
tokenizer_path = "/auto/home/vover/models/saved_models/qwen3-0.6b-tokenizer-smiles-conformer"

[optimizer]
name = "AdamW"
lr = 2e-4

[training]
batch_size = 5
gradient_accumulation_steps = 4
seq_len = 2048
max_norm = 1.0
warmup_steps = 500
steps = 56000
decay_steps_perc = 0.1
num_decays = 4
data_parallel_degree = -1
tensor_parallel_degree = 1
compile = true
dataset = "conformers_train"
data_processing_style = "conformer_style"
representation_type = "SMILES"

[validation]
valid_freq = 14000 
enable_valid = true  # Re-enabled with proper dataset
dataset = "conformers_valid"  # Changed from chemlactica_valid to match training dataset type
batch_size = 5  # Smaller validation batch size to match training

[dataloader]
num_workers = 0  # Disabled multiprocessing to avoid worker issues

[experimental]
pipeline_parallel_degree = 1
enable_async_tensor_parallel = false

[checkpoint]
enable_checkpoint = true
save_folder = "yerevann/Qwen3-0.6B"
interval_type = "steps"
interval = 14000
model_weights_only = false
export_dtype = "float32"
async_mode = "async_with_pinned_mem"

[activation_checkpoint]
mode = 'selective'  # Changed from 'none' to 'selective' to save memory
selective_ac_option = '2'

[float8]
enable_float8_linear = false

[model_download_export]
to_titan = false
weight_source = "huggingface" 