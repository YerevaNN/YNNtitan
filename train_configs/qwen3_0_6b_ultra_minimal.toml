# torchtitan Config.toml - Ultra minimal memory configuration for RTX 3080

[job]
dump_folder = "/nfs/h100/raid/chem/checkpoints"
description = "Qwen3 0.6B training - ultra minimal memory"
use_for_integration_test = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
enable_color_printing = true
enable_aim = false  # Disabled to save memory
save_aim_folder = "aim"

[model]
name = "qwen3"
flavor = "debugmodel"  # Use the smaller debug model instead of 0.6B
norm_type = "rmsnorm"
tokenizer_path = "/auto/home/vover/models/saved_models/qwen3-0.6b/tokenizer"

[optimizer]
name = "AdamW"
lr = 4e-4

[training]
batch_size = 1  # Minimal batch size
gradient_accumulation_steps = 128  # High gradient accumulation to maintain effective batch size
seq_len = 256  # Very short sequence length
max_norm = 1.0
warmup_steps = 100
steps = 1000  # Reduced steps for testing
decay_steps_perc = 0.1
num_decays = 1
data_parallel_degree = -1
tensor_parallel_degree = 1
compile = false  # Disabled compilation to save memory
dataset = "chemlactica_train"
data_processing_style = "chemlactica_style"
representation_type = "SMILES"

[validation]
valid_freq = 500
enable_valid = false  # Disabled validation to save memory
dataset = "chemlactica_valid"
batch_size = 1

[dataloader]
num_workers = 0  # Disable multiprocessing to avoid worker issues

[experimental]
pipeline_parallel_degree = 1
enable_async_tensor_parallel = false

[checkpoint]
enable_checkpoint = false  # Disabled checkpointing for testing
save_folder = "yerevann/Qwen3-0.6B"
interval_type = "steps"
interval = 2000
model_weights_only = true
export_dtype = "float16"
async_mode = "disabled"

[activation_checkpoint]
mode = 'selective'  # Use selective activation checkpointing
selective_ac_option = '2'

[float8]
enable_float8_linear = false

[model_download_export]
to_titan = false  # Disable model download for now
weight_source = "huggingface" 